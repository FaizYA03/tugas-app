# Menjalankan seluruh stack (PostgreSQL + Backend + Frontend) dengan Docker
#
#   docker compose up --build
#
# Lalu buka http://localhost:8080 (frontend) — request /api diteruskan nginx
# ke service backend. Backend otomatis memakai schema.sql saat volume database
# masih kosong (inisialisasi pertama).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tugas_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Inisialisasi schema + seed demo hanya saat volume masih kosong
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d tugas_db']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tugas_db
      JWT_SECRET: ${JWT_SECRET:-ganti-dengan-secret-acak-minimal-32-karakter}
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:8080
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000/api
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      - backend

volumes:
  pgdata:
