# Deploy LIVE DEMO ke GitHub Pages (frontend MODE DEMO, tanpa backend).
#
# Cara mengaktifkan sekali saja:
#   1. Push workflow ini ke branch utama (main/master).
#   2. Buka Settings > Pages > Build and deployment > Source: pilih "GitHub Actions".
#   3. Tunggu workflow selesai, lalu buka URL demo dari output job deploy
#      (umumnya https://<user>.github.io/<repo>/).
name: Demo (GitHub Pages)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build mode demo
        run: npm run build
        env:
          VITE_DEMO_MODE: 'true'
          PAGES_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
